<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | JARVIS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div class="stars"></div><nav class="navbar glass"><a class="brand" href="index.html"><i>J</i> JARVIS</a><a class="button ghost small" href="signup.html">Create account</a></nav><main><div class="page-head"><p class="eyebrow">Welcome back</p><h1>Enter your workspace.</h1><p>Continue where your thoughts left off.</p></div><form class="form-shell glass" id="login-form"><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" placeholder="••••••••" required></div><div class="row"><label class="muted"><input type="checkbox"> Remember me</label><a href="#" id="forgot-password" style="color:var(--cyan)">Forgot password?</a></div><button class="button" type="submit" style="width:100%;margin-top:20px">Sign in →</button><p class="notice">or continue with</p><div class="row"><button type="button" class="button ghost" onclick="Jarvis.loginWithGoogle()" style="flex:1">Google</button><button type="button" class="button ghost" onclick="Jarvis.loginWithGithub()" style="flex:1">GitHub</button></div><p class="notice form-note">New to JARVIS? <a href="signup.html" style="color:var(--cyan)">Create an account</a></p></form></main><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('#login-form');document.querySelector('#forgot-password').onclick=e=>{e.preventDefault();Jarvis.forgotPassword()};f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;const b=f.querySelector('[type=submit]');b.disabled=true;b.textContent='Signing in…';await new Promise(r=>setTimeout(r,650));Jarvis.state.profile.email=f.email.value;Jarvis.state.lastLogin=new Date().toISOString();Jarvis.save();b.textContent='Success ✓';Jarvis.toast('Welcome back to JARVIS');setTimeout(()=>location.href='dashboard.html',450)}})</script></body></html>
