<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Dashboard</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div class="stars"></div><nav class="navbar glass"><a class="brand" href="index.html"><i>J</i> JARVIS</a><div class="nav-links"><a href="chat.html" data-i18n="Chat">Chat</a><a class="active" href="dashboard.html" data-i18n="Dashboard">Dashboard</a><a href="settings.html" data-i18n="Settings">Settings</a></div><button class="nav-toggle round" aria-label="Open navigation">☰</button></nav><main class="container dashboard"><div class="dash-greeting"><div><p class="eyebrow" id="today"></p><h1>Your intelligence workspace.</h1><p class="muted">Local activity and preferences, ready to sync with a backend.</p></div><a class="button" href="chat.html">＋ New chat</a></div><section class="stat-grid" id="stats"></section><section class="dash-grid"><article class="card glass"><h3>Weekly AI usage</h3><p class="muted">Messages in saved conversations</p><div class="chart" id="chart"></div></article><article class="card glass"><h3>Account details</h3><p class="muted">Plan</p><p id="plan" style="font-size:25px;margin:0"></p><p class="muted">Theme / language</p><p id="prefs"></p><p class="muted">Created</p><p id="created"></p></article><article class="card glass recent"><div class="row"><h3>Recent chats</h3><a href="chat.html" style="color:var(--cyan)">View all</a></div><div id="recent"></div></article><article class="card glass"><h3>Storage & files</h3><p class="muted" id="storage"></p><p class="muted" id="files"></p><a class="button ghost small" href="settings.html">Manage settings</a></article></section></main><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const chats=Jarvis.state.chats||[],messages=chats.reduce((n,c)=>n+c.messages.length,0),bytes=new Blob([localStorage.getItem('jarvis.v2')||'']).size;document.querySelector('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});document.querySelector('#stats').innerHTML=[['Chats',chats.length||'No data yet'],['Messages sent',messages||'No data yet'],['Selected plan',Jarvis.state.plan],['Files uploaded','No data yet']].map(([a,b])=>`<article class="stat glass"><span class="muted">${a}</span><b>${b}</b><small class="muted">Local data</small></article>`).join('');document.querySelector('#plan').textContent=Jarvis.state.plan;document.querySelector('#prefs').textContent=`${Jarvis.state.theme} / ${Jarvis.state.language}`;document.querySelector('#created').textContent=new Date(Jarvis.state.createdAt).toLocaleDateString();document.querySelector('#storage').textContent=`Local storage used: ${(bytes/1024).toFixed(1)} KB`;document.querySelector('#files').textContent='Files uploaded: No data yet';const days=['M','T','W','T','F','S','S'],counts=days.map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return chats.reduce((n,c)=>n+c.messages.filter(m=>new Date(m.createdAt).toDateString()===d.toDateString()).length,0)}),max=Math.max(...counts,1);document.querySelector('#chart').innerHTML=counts.map((n,i)=>`<div class="bar" style="height:${Math.max(6,n/max*100)}%"><span>${days[i]}</span></div>`).join('');document.querySelector('#recent').innerHTML=chats.slice(0,4).map(c=>`<div class="recent-row"><span>${Jarvis.escape(c.title)}</span><small class="muted">${new Date(c.updatedAt).toLocaleDateString()}</small></div>`).join('')||'<p class="muted">No data yet</p>'})</script></body></html>
