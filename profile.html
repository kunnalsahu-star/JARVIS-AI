<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | JARVIS</title><link rel="stylesheet" href="css/style.css"></head><body><div class="stars"></div><nav class="navbar glass"><a class="brand" href="index.html"><i>J</i> JARVIS</a><div class="nav-links"><a href="chat.html">Chat</a><a href="dashboard.html">Dashboard</a><a href="settings.html">Settings</a></div></nav><main class="container"><div class="page-head"><p class="eyebrow">Account intelligence</p><h1>Your profile.</h1></div><div class="grid" style="padding-bottom:70px"><section class="card glass"><p class="eyebrow">Member profile</p><h2 id="name"></h2><p class="muted" id="email"></p><button class="button ghost small" id="edit">Edit profile</button> <button class="button ghost small" id="logout">Logout</button></section><section class="card glass"><h3>Workspace status</h3><div id="details" class="profile-details"></div></section></div></main><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const s=Jarvis.state,chats=s.chats||[],m=chats.reduce((n,c)=>n+c.messages.length,0),kb=(new Blob([localStorage.getItem('jarvis.v2')||'']).size/1024).toFixed(1);name.textContent=s.profile.name;email.textContent=s.profile.email||'No email saved';details.innerHTML=[['Current plan',s.plan],['Language',s.language],['Theme',s.theme],['Chats count',chats.length],['Messages sent',m],['Member since',new Date(s.createdAt).toLocaleDateString()],['Last login',new Date(s.lastLogin).toLocaleString()],['Storage used',kb+' KB']].map(x=>`<div class="row"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');edit.onclick=()=>Jarvis.modal('Edit profile',`<div class="field"><label>Name</label><input id="profile-name" value="${Jarvis.escape(s.profile.name)}"></div><div class="field"><label>Email</label><input id="profile-email" type="email" value="${Jarvis.escape(s.profile.email)}"></div>`,[{label:'Cancel',ghost:true},{label:'Save',action:()=>{s.profile.name=document.querySelector('#profile-name').value;s.profile.email=document.querySelector('#profile-email').value;Jarvis.save();location.reload()}}]);logout.onclick=()=>Jarvis.modal('Log out?','<p>Your local chats will stay in this browser.</p>',[{label:'Cancel',ghost:true},{label:'Log out',action:()=>{Jarvis.toast('Logged out locally');location.href='index.html'}}])})</script></body></html>
