<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | JARVIS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div class="stars"></div><nav class="navbar glass"><a class="brand" href="index.html"><i>J</i> JARVIS</a><a class="button ghost small" href="login.html">Sign in</a></nav><main><div class="page-head"><p class="eyebrow">Begin your orbit</p><h1>Create your JARVIS account.</h1></div><form class="form-shell glass" id="signup-form"><div class="field"><label>Full name</label><input placeholder="Your name" required></div><div class="field"><label>Email address</label><input type="email" placeholder="you@example.com" required></div><div class="field"><label>Create password</label><input id="new-password" type="password" minlength="8" placeholder="At least 8 characters" required></div><div style="height:5px;border-radius:4px;background:#162844;overflow:hidden"><i id="strength" style="display:block;height:100%;width:0;background:#ff6584;transition:.2s"></i></div><p class="muted" id="strength-text" style="font-size:12px">Choose a strong password.</p><label class="muted"><input type="checkbox" required> I agree to the Terms and Privacy Policy.</label><button class="button" type="submit" style="width:100%;margin-top:20px">Create account →</button><p class="notice form-note">Already have an account? <a href="login.html" style="color:var(--cyan)">Sign in</a></p></form></main><script src="js/app.js"></script><script>const p=document.querySelector('#new-password'),b=document.querySelector('#strength'),t=document.querySelector('#strength-text');p.oninput=()=>{let s=Math.min(100,p.value.length*10+(/[A-Z]/.test(p.value)?15:0)+(/\d/.test(p.value)?15:0));b.style.width=s+'%';b.style.background=s>75?'#65e5a7':s>45?'#f4c75a':'#ff6584';t.textContent=s>75?'Strong password':s>45?'Getting there':'Choose a strong password.'};document.querySelector('#signup-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const x=f.querySelector('[type=submit]');x.disabled=true;x.textContent='Creating…';await new Promise(r=>setTimeout(r,650));Jarvis.state.profile.name=f.querySelector('input').value;Jarvis.state.profile.email=f.querySelector('input[type=email]').value;Jarvis.state.lastLogin=new Date().toISOString();Jarvis.save();x.textContent='Account created ✓';Jarvis.toast('Your workspace is ready');setTimeout(()=>location.href='dashboard.html',450)}</script></body></html>
