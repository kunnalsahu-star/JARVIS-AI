<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | JARVIS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div class="stars"></div><nav class="navbar glass"><a class="brand" href="index.html"><i>J</i> JARVIS</a><a class="button ghost small" href="index.html#pricing">Change plan</a></nav><main class="container"><div class="page-head"><p class="eyebrow">Secure checkout</p><h1>Complete your workspace.</h1></div><div class="grid" style="padding-bottom:70px"><section class="card glass"><h2>Billing details</h2><form id="checkout-form"><div class="field"><label>Full name</label><input required autocomplete="name"></div><div class="field"><label>Email</label><input type="email" required autocomplete="email"></div><div class="field"><label>Country</label><select required><option value="">Select country</option><option>India</option><option>United States</option><option>United Kingdom</option><option>Other</option></select></div><div class="row"><div class="field" style="flex:1"><label>State</label><input required></div><div class="field" style="flex:1"><label>ZIP Code</label><input required></div></div><h3>Payment method</h3><div class="row"><label><input type="radio" name="payment" checked> Credit Card</label><label><input type="radio" name="payment"> Debit Card</label><label><input type="radio" name="payment"> UPI</label></div><div class="row"><label><input type="radio" name="payment"> Net Banking</label><label><input type="radio" name="payment"> PayPal</label></div><div class="field"><label>Card number</label><input inputmode="numeric" minlength="12" placeholder="1234 5678 9012 3456" required></div><div class="row"><div class="field" style="flex:1"><label>Expiry</label><input placeholder="MM / YY" required></div><div class="field" style="flex:1"><label>CVV</label><input inputmode="numeric" minlength="3" maxlength="4" required></div></div><div class="field"><label>Cardholder name</label><input required></div><div class="field"><label>Coupon code</label><input placeholder="Optional"></div><label class="muted"><input type="checkbox" required> I agree to the Terms and billing conditions.</label><button class="button" type="submit" style="width:100%;margin-top:22px">Pay now</button></form></section><aside class="card glass"><p class="eyebrow">Order summary</p><h2 id="selected-plan">Selected plan</h2><div class="row"><span>Plan price</span><b id="price"></b></div><div class="row"><span>Tax</span><b id="tax"></b></div><hr><div class="row"><h3>Total</h3><h3 id="total"></h3></div><p class="muted">Payments are simulated locally. No card data is stored or sent.</p></aside></div></main><script src="js/app.js"></script><script src="js/premium.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const prices={FREE:0,STANDARD:12,PRO:20},plan=Jarvis.state.plan||'FREE',price=prices[plan],tax=+(price*.18).toFixed(2);document.querySelector('#selected-plan').textContent=plan+' plan';document.querySelector('#price').textContent='$'+price.toFixed(2);document.querySelector('#tax').textContent='$'+tax.toFixed(2);document.querySelector('#total').textContent='$'+(price+tax).toFixed(2);document.querySelector('#checkout-form').onsubmit=e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;Jarvis.processPayment();Jarvis.modal('Payment processing','<p>Payment processing requires backend integration.</p><p>Your selected plan has been saved locally.</p>',[{label:'Return to workspace',action:()=>location.href='dashboard.html'}])}})</script></body></html>
